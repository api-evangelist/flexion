name: Flexion
description: 'Flexion Robotics builds the autonomy stack for humanoid robots — from
  command to control, from manipulation to locomotion, across any hardware and task.
  Founded by former NVIDIA and ETH Zurich reinforcement-learning researchers (Nikita
  Rudin, David Höller, Julian Nubert), the Zurich- and San Francisco-based company
  uses large-scale simulation and reinforcement learning to train generalizable robot
  policies that transfer to real-world hardware. Its Flexion Reflect model line targets
  long-horizon autonomous humanoid work. The company raised $50M and is backed by
  Prosus Ventures. Flexion does not currently expose a public developer API.'
